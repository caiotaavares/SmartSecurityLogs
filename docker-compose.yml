services:
  nginx:
    # (sem alterações)
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:80"
    depends_on:
      - api

# Em docker-compose.yml
  api:
    build:
      context: ./api
      dockerfile: ../Dockerfile.python
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --log-level=debug --access-logfile=- api:app
    depends_on:
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: ../Dockerfile.python
    environment:
      - REDIS_HOST=redis
      - ELASTIC_HOST=elasticsearch
    command: python worker.py
    # command: tail -f /dev/null
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - elasticsearch

  redis:
    # (sem alterações)
    image: "redis:7.2-alpine"
    ports:
      - "6379:6379"

  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.14.0"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  grafana:
    image: "grafana/grafana:11.1.0"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - elasticsearch
  # kibana:
  #   image: "docker.elastic.co/kibana/kibana:8.14.0"
  #   ports:
  #     - "5601:5601" # Kibana roda na porta 5601
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 # Conecta-se automaticamente
  #   depends_on:
  #     - elasticsearch

volumes:
  es_data:
  grafana_data: