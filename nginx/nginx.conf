worker_processes 1;

# O pid do Nginx é necessário para o log de erro em alguns ambientes
pid /var/run/nginx.pid;

# Aumentar o nível de log de erro para nos dar mais informações se algo falhar
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    # Log de acesso para vermos todas as requisições
    access_log /dev/stdout;

    server {
        listen 80;
        server_name localhost;

        # O local principal que o cliente acessa
        location / {
            # Espelha a requisição para o nosso local de análise
            mirror /mirror;
            
            # Responde imediatamente ao cliente
            return 200 "Requisição recebida e enviada para análise em segundo plano.\n";
        }

        # O local interno para onde a requisição espelhada é enviada
        location = /mirror {
            # Marca como interno, não acessível de fora
            internal;

            # Envia a requisição para a API de coleta
            # O resolver é uma boa prática para garantir que o Nginx consiga
            # encontrar outros contêineres na rede Docker.
            resolver 127.0.0.11 valid=10s;
            proxy_pass http://api:5001/log;
            
            # Headers para passar a informação da requisição original
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Client-IP $remote_addr;
            proxy_set_header Host $host;

            proxy_pass_request_body off;
            proxy_connect_timeout 1s;
        }
    }
}