worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Define o endereço do nosso serviço de API Flask
    upstream api_service {
        server api:5000; # 'api' é o nome do serviço no Docker Compose
    }

    # Define um servidor principal que simula a aplicação do seu cliente
    server {
        listen 80;
        server_name localhost;

        # Esta diretiva 'mirror' é a mágica. Ela copia cada requisição
        # e a envia para /mirror SEM bloquear a requisição original.
        mirror /mirror;

        # Requisições para a raiz são respondidas com uma mensagem simples.
        # Em um caso real, aqui iria o `proxy_pass` para a aplicação do seu cliente.
        location / {
            return 200 "Bem-vindo à aplicação principal! Sua requisição está sendo analisada em segundo plano.\n";
        }
    }

    # Este é o local interno para onde as requisições espelhadas são enviadas
    server {
        listen 8081; # Escuta em uma porta interna

        location /mirror {
            # Repassa a requisição para nosso serviço de coleta Flask
            proxy_pass http://api_service/log;

            # Envia os dados da requisição original como headers para a API
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Client-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_pass_request_body off; # Não precisamos do corpo da requisição no mirror
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
        }
    }
}